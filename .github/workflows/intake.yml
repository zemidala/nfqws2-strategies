name: intake

# New issue from the form — check, write to data/ and the pages, reply, close; every run also
# picks up open issues left unprocessed. Label «remove» on an issue (set by the owner) — its record is removed.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:   # manual run: picks up open issues whose own run was cancelled

permissions:
  contents: write
  issues: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'strategy')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'remove')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Process the event and every open strategy issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run.sh
