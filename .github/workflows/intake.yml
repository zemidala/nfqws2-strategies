name: intake

# New issue from the form — check, write to data/ and the pages, reply, close; every run also
# picks up open issues left unprocessed. Label «remove» on an issue (set by the owner) — its record is removed.
on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:   # manual run: picks up open issues whose own run was cancelled
  repository_dispatch:
    types: [relay]     # the relay (relay/worker.js) put a router's submission into the «inbox» branch
  schedule:
    - cron: '17,47 * * * *'   # and every half hour anyway: a dispatch whose run GitHub dropped is not lost

permissions:
  contents: write
  issues: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'schedule' ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'strategy')) ||
      (github.event.action == 'labeled' && github.event.label.name == 'remove')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Process the event and every open strategy issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run.sh
